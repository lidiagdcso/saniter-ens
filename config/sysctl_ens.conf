# ============================================================
# sysctl_ens.conf — Parámetros de kernel bastionado ENS
# Proyecto: Adecuación ENS Categoría MEDIA — Saniter
# Control ENS: [mp.s.1]
# Aplicar con: sudo sysctl -p /etc/sysctl.conf
# Copiar estas líneas al final de /etc/sysctl.conf
# ============================================================
 
# Deshabilitar TCP Timestamps (evita revelar uptime del servidor)
net.ipv4.tcp_timestamps = 0
 
# Deshabilitar respuesta a ICMP timestamp (CVE-1999-0524)
net.ipv4.icmp_echo_ignore_broadcasts = 1
